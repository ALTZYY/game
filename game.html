<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Clicker Simpel</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="game-container">
        <div class="stats">
            <p>Skor Kamu</p>
            <h1 id="score">0</h1>
            <p>Poin per Klik: <span id="click-power">1</span></p>
        </div>

        <!-- Tombol Utama Clicker -->
        <button id="click-btn" class="btn-click">KLIK AKU!</button>

        <!-- Bagian Upgrade -->
        <div class="upgrade-section">
            <button id="upgrade-btn" class="btn-upgrade" disabled>
                Upgrade Klik (+1) <br>
                <small>Biaya: <span id="upgrade-cost">10</span> Poin</small>
            </button>
        </div>
    </div>
    <script src="script.js"></script>

</body>

</html>
